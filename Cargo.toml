[workspace]
resolver = "2"
members = [
  "core/engine",
  "interfaces/cli",
  "languages/javascript-typescript",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tree-sitter = "0.26.12"
tree-sitter-typescript = "0.23.2"
