[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codevanta-training"
version = "0.1.0"
description = "Reproducible CodeVanta dataset, training, and evaluation tooling."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["codevanta_training*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
