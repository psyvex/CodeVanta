[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codevanta-training"
version = "0.1.0"
description = "Reproducible CodeVanta dataset, training, and evaluation tooling."
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.0"]

[project.optional-dependencies]
train = ["torch>=2.2", "transformers>=4.40", "peft>=0.10", "accelerate>=0.30", "tokenizers>=0.19"]
export = ["gguf>=0.1.0", "sentencepiece>=0.1.98,<0.3.0", "protobuf>=4.21.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["codevanta_training*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
